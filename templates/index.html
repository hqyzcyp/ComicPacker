<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicPacker Web Interface</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="container">
        <!-- <header>
            <h1>📚 ComicPacker</h1>
            <p class="subtitle">漫画转换工具 Web 界面</p>
        </header> -->

        <div class="main-grid">
            <!-- 左侧：文件浏览器 -->
            <div class="panel file-browser-panel">
                <h2>📁 文件浏览器</h2>

                <div class="current-path">
                    <input type="text" id="current-path" readonly>
                    <button id="parent-btn" title="返回上级目录">⬆️</button>
                    <button id="refresh-btn" title="刷新">🔄</button>
                    <button id="set-default-btn" title="设为默认路径">📌</button>
                </div>
                <div class="file-list" id="file-list">
                    <div class="loading">加载中...</div>
                </div>
                <div class="selected-folder">
                    <div class="selected-folder-row">
                        <strong>已选择:</strong>
                        <span id="selected-folder-display">未选择</span>
                    </div>
                    <div class="selected-folder-row">
                        <strong>首个文件:</strong>
                        <span id="first-file-display">未读取</span>
                    </div>
                    <div class="selected-folder-row">
                        <strong>命名来源:</strong>
                        <span id="naming-source-display">等待选择文件夹</span>
                    </div>
                </div>
            </div>

            <!-- 右侧：配置和控制 -->
            <div class="panel config-panel">
                <h2>⚙️ 转换配置</h2>
                <form id="conversion-form">
                    <div class="form-group">
                        <label for="mode">转换模式:</label>
                        <select id="mode" name="mode">
                            <option value="book">按书打包</option>
                            <option value="cbz">按CBZ打包</option>
                            <option value="batch">按批次模式</option>
                        </select>
                        <small class="help-text">批次模式: 固定章节数打包 | 按书: 自动检测分书 | CBZ: 每个CBZ一个PDF</small>
                    </div>

                    <div class="form-group" id="batch-size-group" style="display: none;">
                        <label for="batch-size">批次大小:</label>
                        <div class="slider-container">
                            <input type="range" id="batch-size" name="batch_size" min="1" max="50" value="10">
                            <span id="batch-size-value">10</span> 章节/PDF
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="comic-name">漫画输出名:</label>
                        <input type="text" id="comic-name" name="comic_name" placeholder="自动识别，可手动修改">
                        <small class="help-text" id="comic-name-help">会优先从首个文件名推断漫画名，输出文件将尽量按“漫画名 Vol.xx”命名。</small>
                    </div>

                    <div class="form-group">
                        <label>输出名预览:</label>
                        <div class="output-preview" id="output-name-preview">漫画名 Vol.01</div>
                        <small class="help-text" id="output-preview-help">预览格式：漫画名 Vol.01</small>
                    </div>

                    <div class="form-group">
                        <label for="output">输出目录:</label>
                        <input type="text" id="output" name="output" value="./output" placeholder="./output">
                    </div>

                    <div class="form-group checkbox-group">
                        <label>
                            <input type="checkbox" id="convert-to-mobi" name="convert_to_mobi" checked>
                            转换为 MOBI 格式
                        </label>
                    </div>

                    <div class="form-group" id="kindle-profile-group">
                        <label for="kindle-profile">Kindle 设备:</label>
                        <select id="kindle-profile" name="kindle_profile">
                            <option value="KPW5" selected>Kindle Paperwhite 5</option>
                            <option value="KPW">Kindle Paperwhite</option>
                            <option value="KV">Kindle Voyage</option>
                            <option value="KO">Kindle Oasis</option>
                            <option value="K11">Kindle 11th Gen</option>
                            <option value="KS">Kindle Scribe</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary" id="start-btn">
                        🚀 开始转换
                    </button>
                </form>
            </div>
        </div>


        <!-- 控制台输出 -->
        <div class="panel console-panel">
            <div class="panel-header">
                <h2>🖥️ 控制台输出</h2>
                <button type="button" class="btn-small" id="expand-console-btn">🔍 放大查看</button>
            </div>
            <div class="console-output" id="console-output">
                <div class="console-line">等待任务输出...</div>
            </div>
        </div>


        <!-- 任务历史 -->
        <div class="panel history-panel">
            <div class="job-history-header">
                <h2>📜 任务历史</h2>
                <div class="system-stats" id="system-stats">
                    <div class="stat-item">
                        <span class="stat-label">CPU:</span>
                        <span class="stat-value" id="cpu-usage">--</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">内存:</span>
                        <span class="stat-value" id="memory-usage">--</span>
                    </div>
                </div>
                <button id="clear-history-btn" class="btn-small">🗑️ 清除历史</button>
            </div>
            <div class="job-list" id="job-list">
                <div class="empty-state">暂无任务记录</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="console-modal" hidden>
        <div class="modal-content console-modal-content" role="dialog" aria-modal="true" aria-labelledby="console-modal-title">
            <div class="modal-header">
                <h2 id="console-modal-title">🖥️ 转换日志大窗口</h2>
                <button type="button" class="btn-small" id="close-console-modal-btn">✖ 关闭</button>
            </div>
            <div class="console-output console-output-large" id="console-output-modal">
                <div class="console-line">等待任务输出...</div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>

</html>
